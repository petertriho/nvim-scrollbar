name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Only the nightly job runs on the schedule
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Check formatting
        run: nix develop -c make format-check
      - name: Lint
        run: nix develop -c make lint
      - name: Typecheck
        run: nix develop -c make typecheck

  test:
    name: Neovim ${{ matrix.neovim }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - neovim: stable
            shell: default
          - neovim: 0.11.0
            shell: nvim-0_11_0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Show Neovim version
        run: nix develop ".#${{ matrix.shell }}" -c nvim --version
      - name: Test
        run: nix develop ".#${{ matrix.shell }}" -c make test

  # Shared runners are noisy, so a failed comparison is a warning to read in the job summary, not a failed check
  bench:
    name: Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its parents. The first parent is the base branch.
          fetch-depth: 2
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Compare with the base branch
        env:
          BENCH_RUNS: 3
        run: nix develop -c scripts/bench-compare.sh HEAD^1

  # Dependabot and `nix flake update` can lock an overlay commit that is not in the cache yet. Then
  # `nix develop .#nightly` builds Neovim from source.
  nightly-cache:
    name: Nightly cache
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Check that the locked nightly is in the cache
        run: scripts/nightly-cache.sh check

  nightly:
    name: Neovim nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      # The overlay updates each day at 00:00 UTC, and its CI then pushes the build to the cache. The job uses the newest
      # overlay commit that is in the cache, not the locked one, so it tests a recent nightly without a source build.
      - name: Find the newest cached nightly
        id: overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev=$(scripts/nightly-cache.sh latest)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Show Neovim version
        env:
          OVERLAY: github:nix-community/neovim-nightly-overlay/${{ steps.overlay.outputs.rev }}
        run: >-
          nix develop .#nightly
          --override-input neovim-nightly-overlay "$OVERLAY"
          --no-write-lock-file
          -c nvim --version
      - name: Test
        env:
          OVERLAY: github:nix-community/neovim-nightly-overlay/${{ steps.overlay.outputs.rev }}
        run: >-
          nix develop .#nightly
          --override-input neovim-nightly-overlay "$OVERLAY"
          --no-write-lock-file
          -c make test
